services:
  backend:
    build:
      context: ./gmail-data-collection-engine/gmail-data-collection-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./gmail-data-collection-engine/gmail-data-collection-engine/.env
    volumes:
      - ./gmail-data-collection-engine/gmail-data-collection-engine/secrets:/app/secrets
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
